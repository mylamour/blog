name: external links

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  external-links:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [zh, en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.site }}
      - run: node tools/check-external-links.js --dir public
