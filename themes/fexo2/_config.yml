# Comment service
disqus_shortname: 
# hypercomments_id: 89821
# gentie_key: d16a7241e7cd4b389584ed8db2a4e8bc

# Valine comment system  https://valine.js.org
valine:
  enable: false # 如果使用valine，请设置改之为true
  appid:  # your leancloud application appid
  appkey:  # your leancloud application appkey
  notify: false # mail notifier , https://github.com/xCss/Valine/wiki
  verify: false # Verification code
  placeholder: Just go go # comment box placeholder
  avatar: mm # gravatar style
  guest_info: nick,mail,link # custom comment header
  pageSize: 10 # pagination size

# Giscus comment system  https://giscus.app you need access this website and input your repository name and category name 
#  then you will get related information to fill in the config.yml
giscus:
  enable: true # Set to true to enable giscus
  repo: mylamour/blog # GitHub repository in the format: username/repo
  repo_id: MDEwOlJlcG9zaXRvcnk1MDkxMzE2Mw== # Repository ID, get from https://giscus.app
  category: Announcements # Discussion category name
  category_id: DIC_kwDOAwjfi84CBF9i # Category ID, get from https://giscus.app
  mapping: pathname # pathname, url, title, og:title
  strict: 0 # 0 = disabled, 1 = enabled
  reactions_enabled: 1 # 1 = enabled, 0 = disabled
  emit_metadata: 0
  input_position: bottom # top or bottom
  theme: light # light, dark, dark_dimmed, transparent_dark, preferred_color_scheme
  lang: zh-CN # en, zh-CN, zh-TW, etc.
  loading: lazy # lazy or eager


