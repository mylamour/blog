# Blog info
blog_name: 開新小室
slogan:  吾生也有涯, 而知也无涯
# Inclusive, Adaptive, Multifaceted, Innovative
# 记录一个安全架构师的成长过程
url: https://fz.cool
# author: 放之
# Set avatar (Absolute url and relative url)
avatar: /images/avatar.png

# Set favicon
favicon: /favicon.ico

# For seo
keywords: AI安全 Agent开发 安全架构 安全架构师 企业安全建设 数据安全 应用安全 基础安全 SDLC 安全研发 机器学习与人工智能 机器学习与入侵检测

# Custom CSS style, 推荐把样式文件放在blog源码文件夹，而不是主题里面
personal_style: /css/custom.css

# config home nav
home_nav:
  - name: 笔记
    url: /blog/
    icon: icon-text
    target_blank: true
  - name: 书单
    url: https://iread.fz.cool
    icon: icon-list
    target_blank: true
  - name: 关于
    url: /about/
    icon: icon-user
    target_blank: true
  - name: 订阅
    url: /atom.xml
    icon: icon-rss
    target_blank: true

# config page nav
page_nav:
  - name: 搜索
    url: /search/
    target_blank: true # 在新页面打开
  - name: 分类
    url: /category/
    target_blank: true
  - name: 标签
    url: /tag/
    target_blank: true
  - name: 订阅
    url: /atom.xml
    target_blank: true # 在新页面打开

page_nav_style: ROUND_RECT  # CIRCLE|ROUND_RECT

# 面包屑
breadcrumb:
  isShow: false # true|fase

# 盒子
toolbox:
  isShow: true # true|fase
  text: 𝛑
  # 🔜🥷⛏️

search_slogan:
  isShow: true # true|fase
  text: 企业安全架构 数据安全 安全架构 应用安全

post:
  header_align: LEFT # LEFT|CENTER
  showToc: true # true|false
  showComments: true # Set to true to show comments
  open_in_new_window: true
  show_prev_next: false

# =========================================================
# 个性化设置
# =========================================================

# 这个值取决于你得背景图片是深色还是浅色，深色用dark，浅色用light
home_background_scheme: light # dark、light

# custom font-family 暂时只支持这3种英文字体，你可以完全自定义字体(看文档)
# blog_name_font_familiy: calligraffittiregular
blog_name_font_familiy: FZShuSong
# blog_name_font_familiy: Helvetica
# blog_name_font_familiy: TESTFONT
init_page_content: HOME_NAV # HOME_NAV | POST


