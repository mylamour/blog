# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

sitemap:  
  path: sitemap.xml  

# Site
title: 開新小室|放之
subtitle: 吾生也有涯, 而知也无涯
description: 放之的个人博客,记录一个信息安全架构师的成长过程,也会有些生活感悟。
author: 放之
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
#  due to i changed the layout with hexo, google pagerank still index the old link. below configuration can works for old one
url: https://fz.cool/
root: /
permalink: :title/
permalink_defaults:
alt_lang: en
alt_lang_url: https://iami.xyz
#  backup configurateion

# url: https://iami.xyz/
# root: /
# permalink: /blog/:year/:month/:day/:title/
# permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: blog
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 把 Netlify 的 _headers/_redirects 复制进 public（Hexo 默认跳过下划线开头文件）
include:
  - _headers
  - _redirects

# Writing
new_post_name: :year-:month-:day-:title.md
 # File name of new posts
default_layout: posts

titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
  line_number: false
  auto_detect: false
  tab_replace:

prismjs:
  enable: true
  preprocess: false
  line_number: false
  tab_replace: ''

# Marked renderer config
marked:
  gfm: true
  pedantic: false
  breaks: true
  smartLists: true
  smartypants: true
  lazyload: true
  modifyAnchors: 0
  autolink: true
  sanitizeUrl: false
  headerIds: true
  prependRoot: false
  external_link:
    enable: false
  
# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 0
  order_by: -date
  
# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 0
pagination_dir: page

# Extensions
## Plugins: http://hexo.io/plugins/
# RSS 订阅（hexo-generator-feed）
feed:
  type: atom
  path: atom.xml
  limit: 20
## Themes: https://hexo.io/themes/
theme: fexo2
